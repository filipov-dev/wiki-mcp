[package]
name = "wiki-mcp"
description = "MCP server and CLI for the Yandex Wiki Public API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
# Тело запроса с файлом (одноразовый адрес загрузки) читается потоком: Stream -> AsyncRead.
futures-util = { version = "0.3.34", default-features = false }
mcp-kit = { git = "https://git.sourcecraft.dev/filipov-dev/mcp-kit.git", tag = "v0.1.0" }
# rustls без OpenSSL: бинарник собирается статически (musl).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.0"
toml_edit = "0.25.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
wiki-api = { version = "0.3.0", path = "../wiki-api" }
wiki-mcp-core = { version = "0.3.0", path = "../wiki-mcp-core" }

[lints]
workspace = true

[dev-dependencies]
# Тестовые ключи сервисного аккаунта создаются в тестах, а не хранятся в репозитории.
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
rmcp = { version = "3.8.0", default-features = false, features = ["client", "server"] }
tempfile = "3.27.0"
wiremock = "0.6.5"
