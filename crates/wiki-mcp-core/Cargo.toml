[package]
name = "wiki-mcp-core"
description = "Transport-agnostic MCP tools for the Yandex Wiki Public API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Одноразовые адреса загрузки (HTTP-режим): случайный секрет, отпечаток учётных данных
# (HMAC-SHA256) и сравнение за постоянное время.
getrandom = "0.4.3"
hmac = "0.12.1"
# Фильтр ответа `jq` (диалект jaq): без файлов, окружения и сети.
jaq-core = "3.1.2"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.4"
percent-encoding = "2.3.2"
regex = "1.13.1"
rmcp = { version = "3.8.0", default-features = false, features = ["server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
# Процесс фильтра `jq`, таймауты и уведомления о смене списка инструментов.
tokio = { version = "1.54.1", features = ["fs", "process", "io-util", "time", "sync", "macros"] }
tracing = "0.1.44"
wiki-api = { version = "0.3.1", path = "../wiki-api" }

[dev-dependencies]
tempfile = "3.27.0"
rmcp = { version = "3.8.0", default-features = false, features = ["client", "server"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-util"] }
wiremock = "0.6.5"

[lints]
workspace = true
