[package]
name = "wiki-api"
description = "Yandex Wiki Public API: specification-driven operations, request executor and token storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Secret Service в Linux — через zbus (чистый Rust, рантайм async-io, шифрование
# сессии на Rust): бинарник не линкуется с libdbus и OpenSSL и собирается статически
# (musl). async-io крутит D-Bus в своём потоке, поэтому синхронный API keyring
# можно вызывать из кода внутри tokio-рантайма без взаимоблокировки.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
percent-encoding = "2.3.2"
# rustls без OpenSSL: бинарник собирается статически (musl).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "time"] }
tracing = "0.1.44"
url = "2.5.8"

[build-dependencies]
serde_json = "1.0.154"

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[lints]
workspace = true
